  /* película leve só para garantir leitura, sem esconder o infográfico */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(160deg, rgba(8,8,30,.35), rgba(30,10,60,.45));
    z-index: -1;
  }
  .pagina { max-width: 1100px; margin: 0 auto; }

  /* ---------- Cabeçalho com o autor ---------- */
  .hero {
    display: flex; align-items: center; gap: 32px;
    padding: 32px 36px;
    background: var(--fundo-vidro);
    border: 1px solid var(--borda);
    border-radius: 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(107,233,255,.25), 0 0 80px rgba(208,140,255,.18);
  }
  .foto {
    flex: none;
    width: 180px; height: 180px;
    border-radius: 50%;
    padding: 5px;
    background: conic-gradient(var(--ciano), var(--lilas), var(--rosa), var(--ambar), var(--ciano));
    box-shadow: 0 0 28px rgba(107,233,255,.6);
    animation: girar-brilho 6s ease-in-out infinite alternate;
  }
  .foto img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 25%;
    border-radius: 50%;
    border: 4px solid #12102e;
    display: block;
  }
  @keyframes girar-brilho {
    from { box-shadow: 0 0 22px rgba(107,233,255,.5); }
    to   { box-shadow: 0 0 44px rgba(208,140,255,.8); }
  }
  .hero h1 {
    font-family: 'Sora', Arial, sans-serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.1;
    margin: 0 0 10px;
    background: linear-gradient(90deg, var(--ciano), var(--lilas) 60%, var(--rosa));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .autor { font-size: 1.3rem; font-weight: 800; margin: 0 0 6px; }
  .sub { margin: 0; color: #e6e1ff; font-size: 1.05rem; max-width: 46ch; }

  /* ---------- Seletor de layout ---------- */
  .painel {
    margin-top: 28px;
    padding: 28px 32px 34px;
    background: var(--fundo-vidro);
    border: 1px solid var(--borda);
    border-radius: 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .painel h2 {
    font-family: 'Sora', Arial, sans-serif;
    margin: 0 0 14px;
    font-size: 1.6rem;
    color: var(--ambar);
  }
  .seletor { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 26px; }
  .seletor label { font-weight: 600; color: #e6e1ff; }
  select {
    font: inherit; font-weight: 800;
    color: #fff;
    background: rgba(255,255,255,.12);
    border: 2px solid var(--ciano);
    border-radius: 14px;
    padding: 10px 40px 10px 16px;
    cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ciano) 50%), linear-gradient(135deg, var(--ciano) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
    background-size: 6px 6px; background-repeat: no-repeat;
  }
  select option { color: #111; background: #fff; }
  select:focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }

  /* ---------- Turmas (3 layouts) ---------- */
  #container { transition: all .3s ease; }
  .grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
  .lista { display: block; }
  .cards { display: flex; flex-wrap: wrap; gap: 20px; }

  .turma {
    --cor: var(--ciano);
    background: rgba(10, 8, 34, 0.72);
    border: 2px solid var(--cor);
    border-radius: 18px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 0 18px color-mix(in srgb, var(--cor) 45%, transparent);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .turma:nth-child(4n+2) { --cor: var(--lilas); }
  .turma:nth-child(4n+3) { --cor: var(--ambar); }
  .turma:nth-child(4n+4) { --cor: var(--rosa); }
  .turma:hover { transform: translateY(-5px); box-shadow: 0 0 30px var(--cor); }
  .turma .icone { font-size: 2.4rem; display: block; margin-bottom: 6px; }
  .turma strong { font-family: 'Sora', Arial, sans-serif; font-size: 1.3rem; color: var(--cor); display: block; }
  .turma span.tema { display: block; margin-top: 6px; color: #f0ecff; font-size: .98rem; }

  .lista .turma {
    display: flex; align-items: center; gap: 18px;
    text-align: left; margin-bottom: 14px;
    border-width: 0 0 0 8px; border-radius: 14px;
  }
  .lista .turma .icone { margin: 0; }
  .cards .turma { flex: 1 1 260px; padding: 32px 24px; border-radius: 26px; }
  .cards .turma .icone { font-size: 3.2rem; }

  a.turma { display: block; color: inherit; text-decoration: none; }
  .turma.clicavel { cursor: pointer; }
  .turma .abrir {
    display: inline-block; margin-top: 12px; padding: 6px 16px;
    font-weight: 800; font-size: .9rem; color: #12102e;
    background: var(--cor); border-radius: 999px;
  }
  .turma.clicavel:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .lista a.turma { display: flex; }
  .lista .turma .abrir { margin: 0 0 0 auto; }

  button.turma { font: inherit; color: #fff; width: 100%; cursor: pointer; }
  .cards button.turma { width: auto; }
  dialog#janela, dialog#visualizador {
    width: min(480px, 92vw); border: 2px solid var(--ciano); border-radius: 24px;
    padding: 28px 24px 24px; color: #fff; text-align: center;
    background: rgba(14, 12, 40, .94);
    box-shadow: 0 0 40px rgba(107,233,255,.5), 0 0 80px rgba(208,140,255,.3);
  }
  dialog#janela::backdrop, dialog#visualizador::backdrop { background: rgba(5, 4, 20, .7); backdrop-filter: blur(4px); }
  .j-titulo { font-family: 'Sora', Arial, sans-serif; font-size: 1.6rem; margin: 0 0 4px; color: var(--ambar); }
  .j-tema { margin: 0 0 20px; color: #e6e1ff; }
  .j-links { display: flex; flex-direction: column; gap: 12px; }
  .j-botao {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 14px 18px; border-radius: 16px; text-decoration: none; color: #fff;
    background: linear-gradient(90deg, rgba(107,233,255,.22), rgba(208,140,255,.22));
    border: 1.5px solid rgba(255,255,255,.35);
    transition: transform .15s ease, border-color .15s ease;
  }
  .j-botao:hover, .j-botao:focus-visible { transform: translateX(4px); border-color: var(--ciano); outline: none; }
  .j-botao span { font-size: 1.6rem; }
  .j-botao strong { font-size: 1.1rem; }
  .j-fechar {
    position: absolute; top: 10px; right: 12px; width: 36px; height: 36px;
    border-radius: 50%; border: 0; cursor: pointer; font-size: 1rem;
    color: #fff; background: rgba(255,255,255,.15);
  }
  .j-fechar:hover, .j-fechar:focus-visible { background: var(--rosa); outline: none; }

  dialog#janela { max-height: 92vh; overflow: auto; }
  dialog#visualizador { width: min(980px, 96vw); max-height: 94vh; overflow: auto; padding: 24px 18px 18px; }
  .j-linha { display: flex; gap: 10px; align-items: stretch; }
  .j-linha .j-botao { flex: 1; }
  .j-botao small { display: block; font-size: .85rem; font-weight: 400; opacity: .85; }
  .j-baixar {
    display: flex; align-items: center; justify-content: center; flex: none; width: 56px;
    border-radius: 16px; border: 1.5px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1);
    color: #fff; text-decoration: none; font-size: 1.4rem;
  }
  .j-baixar:hover, .j-baixar:focus-visible { border-color: var(--ciano); background: rgba(107,233,255,.25); }
  .v-area { margin: 14px 0; display: flex; justify-content: center; }
  .v-area video, .v-area audio, .v-area iframe, .v-area img { width: 100%; max-width: 100%; border-radius: 14px; background: #000; }
  .v-area video, .v-area iframe { height: min(70vh, 56vw); min-height: 260px; }
  .v-area iframe[src*="drive.google"], .v-area iframe:not([src*="youtube"]) { min-height: 60vh; }
  .v-area img { width: auto; max-height: 70vh; object-fit: contain; }
  .v-acoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .v-botao {
    display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px;
    font-weight: 800; text-decoration: none; color: #12102e; background: var(--ciano);
  }
  .v-botao[hidden] { display: none; }
  .v-botao.v-baixar { background: var(--ambar); }
  html.calmo dialog { box-shadow: none; }
  html.contraste .v-botao { color: #000; }

  .rodape { margin-top: 28px; text-align: center; font-size: .95rem; color: #e6e1ff; }


  /* ---------- Acessibilidade ---------- */
  .pular { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 10px 16px; border-radius: 10px; background: #fff; color: #000; font-weight: 800; text-decoration: none; }
  .pular:focus { top: 12px; }
  a:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px #000; }
  #conteudo:focus { outline: none; }

  #btnAcess {
    position: fixed; right: 18px; bottom: 18px; z-index: 60;
    display: flex; align-items: center; gap: 8px;
    min-height: 52px; padding: 0 20px; border: 2px solid #fff; border-radius: 999px;
    font: 800 1rem 'Nunito', Arial, sans-serif; color: #12102e; cursor: pointer;
    background: linear-gradient(90deg, var(--ciano), var(--lilas));
    box-shadow: 0 6px 22px rgba(0,0,0,.5);
  }
  #painelAcess {
    position: fixed; right: 18px; bottom: 82px; z-index: 60;
    width: min(340px, calc(100vw - 36px)); max-height: calc(100vh - 110px); overflow: auto;
    padding: 20px; border-radius: 22px; border: 2px solid var(--ciano);
    background: rgba(14, 12, 40, .97); color: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #painelAcess[hidden] { display: none; }
  #painelAcess h2 { font-family: 'Sora', Arial, sans-serif; font-size: 1.2rem; margin: 0 0 12px; color: var(--ambar); }
  .ac-grupo { margin-bottom: 12px; }
  .ac-linha { display: flex; align-items: center; gap: 8px; }
  .ac-btn {
    flex: 1; min-height: 46px; padding: 8px 12px; border-radius: 12px; cursor: pointer;
    font: 700 .95rem 'Nunito', Arial, sans-serif; color: #fff; text-align: left;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.35);
  }
  .ac-btn[aria-pressed="true"] { background: var(--ciano); color: #0a0a22; border-color: var(--ciano); }
  .ac-btn.centro { text-align: center; }
  .ac-dica { display: block; font-weight: 400; font-size: .8rem; opacity: .85; }
  #acEscala { min-width: 56px; text-align: center; font-weight: 800; }

  /* modo calmo: menos estímulos visuais (apoio para TEA e sensibilidade sensorial) */
  html.calmo { --ciano: #a8d5e2; --lilas: #c3b5e0; --ambar: #e8cf9d; --rosa: #e3b5c9; }
  html.calmo body { background: #1f2a47 !important; }
  html.calmo body::before { display: none; }
  html.calmo *, html.calmo *::before, html.calmo *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  html.calmo .hero, html.calmo .painel { backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; background: #28345a; }
  html.calmo .foto { box-shadow: none; background: var(--ciano); }
  html.calmo .hero h1 { background: none; color: #fff; -webkit-text-fill-color: #fff; }
  html.calmo .turma { box-shadow: none; background: #1a2340; }
  html.calmo .turma:hover { transform: none; box-shadow: none; }

  /* alto contraste (baixa visão) */
  html.contraste { --ciano: #ffee00; --lilas: #ffffff; --ambar: #ffee00; --rosa: #00ffff; }
  html.contraste body { background: #000 !important; color: #fff; }
  html.contraste body::before { display: none; }
  html.contraste .hero, html.contraste .painel, html.contraste .turma, html.contraste dialog#janela, html.contraste dialog#visualizador, html.contraste #painelAcess {
    background: #000; border: 3px solid #fff; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  html.contraste .turma { border-color: var(--cor); }
  html.contraste .hero h1 { background: none; color: #ffee00; -webkit-text-fill-color: #ffee00; }
  html.contraste .sub, html.contraste .tema, html.contraste .j-tema, html.contraste .rodape, html.contraste .seletor label { color: #fff; }
  html.contraste select { background-color: #000; border-color: #ffee00; }
  html.contraste .j-botao { background: #000; border: 3px solid #ffee00; }
  html.contraste .foto { box-shadow: none; }
  html.contraste .ac-btn { background: #000; border-color: #fff; }
  html.contraste .ac-btn[aria-pressed="true"] { background: #ffee00; color: #000; }

  /* leitura facilitada (dislexia, baixa visão): fonte clara e mais espaço */
  html.leitura, html.leitura * { font-family: 'Atkinson Hyperlegible', Verdana, Arial, sans-serif !important; }
  html.leitura body { letter-spacing: .03em; word-spacing: .1em; line-height: 1.7; }

  @media (max-width: 760px) {
    body { padding: 18px 12px 40px; }
    .hero { flex-direction: column; text-align: center; padding: 28px 20px; }
    .foto { width: 150px; height: 150px; }
    .painel { padding: 22px 18px 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .foto { animation: none; }
    .turma, #container { transition: none; }
  }
</style>

<script>
// ÁREA DO PROFESSOR: edite aqui as turmas (botões) e os materiais de cada uma.
// Você pode ter QUANTAS turmas quiser: copie um bloco { icone... } inteiro, cole embaixo
// e ponha vírgula no bloco de cima (o último bloco fica sem vírgula).
//
// Cada material fica em links: [ ... ] e tem:  icone (opcional), texto, url
// O site reconhece o tipo sozinho pelo endereço:
//   vídeo  (.mp4 .webm)   -> toca dentro da página   url: "materiais/aula1.mp4"
//   áudio  (.mp3 .wav)    -> toca dentro da página
//   PDF    (.pdf)         -> abre para ler na página, com botão de baixar
//   imagem (.jpg .png)    -> mostra na página, com botão de baixar
//   YouTube / Google Drive (link) -> abre dentro da página
//   Word, PowerPoint, Excel, ZIP... -> baixa o arquivo
//   outra página (https://... ou outra-pagina.html) -> abre em nova aba (seus outros sites)
// Opções extras:  baixar: true  (força o download)   legenda: "materiais/aula1.vtt" (legenda do vídeo)
//
// Arquivos próprios: suba na pasta "materiais" do GitHub e use o caminho, ex.: "materiais/apostila.pdf".
// Use nomes sem espaços e sem acentos. Link com url: "" (vazio) não aparece.
const TURMAS = [
  { icone: "📊", nome: "Turma A", tema: "Planejamento e organização",
    links: [
      { texto: "Página da turma",   url: "" },
      { texto: "Vídeo aula",        url: "" },
      { texto: "Apostila em PDF",   url: "" },
      { texto: "Slides da aula",    url: "" },
      { texto: "Quiz",              url: "" }
    ] },
  { icone: "🤝", nome: "Turma B", tema: "Liderança e trabalho em equipe",
    links: [
      { texto: "Página da turma",   url: "" },
      { texto: "Vídeo aula",        url: "" },
      { texto: "Material em PDF",   url: "" }
    ] },
  { icone: "💡", nome: "Turma C", tema: "Inovação e tecnologia na gestão",
    links: [
      { texto: "Página da turma",   url: "" },
      { texto: "Vídeo aula",        url: "" },
      { texto: "Material em PDF",   url: "" },
      { icone: "🧠", texto: "Quiz: Modelos de Administração Pública", url: "turma-c/quiz-modelos-adm.html" }
    ] },
  { icone: "🚀", nome: "Turma D", tema: "Empreendedorismo e carreira",
    links: [
      { texto: "Página da turma",   url: "" },
      { texto: "Vídeo aula",        url: "" },
      { texto: "Material em PDF",   url: "" }

<script>
  // monta as turmas a partir da lista TURMAS (só o professor edita)
  const janela = document.getElementById('janela');

  const visualizador = document.getElementById('visualizador');
  const ICONES = { video: '🎬', youtube: '🎬', audio: '🎧', pdf: '📄', imagem: '🖼️', arquivo: '📦', drive: '📁', pagina: '🔗' };
  const DICAS  = { video: 'Assistir aqui', youtube: 'Assistir aqui (YouTube)', audio: 'Ouvir aqui', pdf: 'Ler aqui',
                   imagem: 'Ver imagem', arquivo: 'Baixa o arquivo', drive: 'Abrir aqui (Google Drive)', pagina: 'Abre em nova aba' };

  // reconhece o tipo do material pelo endereço (ou por tipo: "..." escrito pelo professor)
  function tipoDe(l) {
    if (l.tipo) return l.tipo;
    if (/youtube\.com|youtu\.be/.test(l.url)) return 'youtube';
    if (/drive\.google\.com\/file\/d\//.test(l.url)) return 'drive';
    const m = l.url.toLowerCase().split('?')[0].split('#')[0].match(/\.([a-z0-9]+)$/);
    const ext = m ? m[1] : '';
    if (['mp4', 'webm', 'mov', 'm4v', 'ogv'].indexOf(ext) > -1) return 'video';
    if (['mp3', 'wav', 'm4a', 'oga', 'ogg'].indexOf(ext) > -1) return 'audio';
    if (ext === 'pdf') return 'pdf';
    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].indexOf(ext) > -1) return 'imagem';
    if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'zip', 'rar', '7z', 'txt', 'csv', 'odt', 'odp', 'ods'].indexOf(ext) > -1) return 'arquivo';
    return 'pagina';
  }
  function ytId(u) { const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : ''; }
  function driveId(u) { const m = u.match(/\/file\/d\/([\w-]+)/); return m ? m[1] : ''; }
  // endereço de download (vazio quando não existe, como páginas e YouTube)
  function urlBaixar(l) {
    if (l.t === 'drive') return 'https://drive.google.com/uc?export=download&id=' + driveId(l.url);
    if (l.t === 'youtube' || l.t === 'pagina') return '';
    return l.url;
  }
  function baixarArquivo(l) {
    const d = document.createElement('a');
    d.href = urlBaixar(l) || l.url; d.download = ''; d.target = '_blank'; d.rel = 'noopener';
    document.body.appendChild(d); d.click(); d.remove();
  }

  function abrirVisualizador(l) {
    const area = visualizador.querySelector('.v-area');
    area.textContent = '';
    visualizador.querySelector('.v-titulo').textContent = (l.icone || ICONES[l.t]) + ' ' + l.texto;
    let el;
    if (l.t === 'video' || l.t === 'audio') {
      el = document.createElement(l.t === 'video' ? 'video' : 'audio');
      el.controls = true; el.preload = 'metadata'; el.playsInline = true; el.src = l.url;
      el.setAttribute('aria-label', l.texto);
      if (l.legenda) {
        const tr = document.createElement('track');
        tr.kind = 'captions'; tr.srclang = 'pt-BR'; tr.label = 'Português'; tr.src = l.legenda; tr.default = true;
        el.appendChild(tr);
      }
    } else if (l.t === 'imagem') {
      el = document.createElement('img'); el.src = l.url; el.alt = l.alt || l.texto;
    } else {
      el = document.createElement('iframe'); el.title = l.texto; el.allowFullscreen = true;
      el.src = l.t === 'youtube' ? 'https://www.youtube-nocookie.com/embed/' + ytId(l.url)
             : l.t === 'drive'   ? 'https://drive.google.com/file/d/' + driveId(l.url) + '/preview'
             : l.url;
    }
    area.appendChild(el);
    visualizador.querySelector('.v-abrir').href = l.url;
    const bx = visualizador.querySelector('.v-baixar'), du = urlBaixar(l);
    if (du) { bx.href = du; bx.hidden = false; if (l.t !== 'drive') bx.setAttribute('download', ''); } else { bx.hidden = true; }
    visualizador.showModal();
  }
  visualizador.addEventListener('close', function () { visualizador.querySelector('.v-area').textContent = ''; });
  visualizador.addEventListener('click', function (e) { if (e.target === visualizador) visualizador.close(); });

  function abrirLink(l) {
    if (l.baixar || l.t === 'arquivo') { baixarArquivo(l); return; }
    if (l.t === 'pagina') { window.open(l.url, '_blank', 'noopener'); return; }
    abrirVisualizador(l);
  }

  function abrirTurma(t, links) {
    if (links.length === 1) { abrirLink(links[0]); return; }
    janela.querySelector('.j-titulo').textContent = (t.icone || '') + ' ' + (t.nome || '');
    janela.querySelector('.j-tema').textContent = t.tema || '';
    const lista = janela.querySelector('.j-links');
    lista.textContent = '';
    links.forEach(function (l) {
      const linha = document.createElement('div'); linha.className = 'j-linha';
      const a = document.createElement('a'); a.href = l.url; a.className = 'j-botao';
      if (l.t === 'pagina' && !l.baixar) { a.target = '_blank'; a.rel = 'noopener'; }
      else { a.onclick = function (e) { e.preventDefault(); abrirLink(l); }; }
      const i = document.createElement('span'); i.textContent = l.icone || ICONES[l.t];
      const box = document.createElement('div');
      const x = document.createElement('strong'); x.textContent = l.texto;
      const d = document.createElement('small'); d.className = 'j-dica'; d.textContent = l.baixar ? 'Baixa o arquivo' : DICAS[l.t];
      box.append(x, d); a.append(i, box); linha.appendChild(a);
      const du = urlBaixar(l);
      if (du && l.t !== 'arquivo' && !l.baixar) {
        const bx = document.createElement('a');
        bx.className = 'j-baixar'; bx.href = du; bx.textContent = '⬇'; bx.setAttribute('aria-label', 'Baixar ' + l.texto);
        if (l.t !== 'drive') bx.setAttribute('download', ''); else { bx.target = '_blank'; bx.rel = 'noopener'; }
        linha.appendChild(bx);
      }
      lista.appendChild(linha);
    });
    janela.showModal();
  }

  function montarTurmas() {
    const container = document.getElementById('container');
    container.textContent = '';
    (typeof TURMAS !== 'undefined' ? TURMAS : []).forEach(function (t) {
      const links = (t.links || []).filter(function (l) { return l && l.url && l.url.trim(); })
                                   .map(function (l) {
                                     l.url = l.url.trim(); l.t = tipoDe(l);
                                     if (!l.texto) l.texto = l.url.split('/').pop();
                                     return l; });
      const temLink = links.length > 0;
      const card = document.createElement(temLink ? 'button' : 'div');
      card.className = 'turma';
      if (temLink) { card.type = 'button'; card.classList.add('clicavel'); card.onclick = function () { abrirTurma(t, links); }; }
      const ic = document.createElement('span'); ic.className = 'icone'; ic.textContent = t.icone || '';
      const nm = document.createElement('strong'); nm.textContent = t.nome || '';
      const tm = document.createElement('span'); tm.className = 'tema'; tm.textContent = t.tema || '';
      card.append(ic, nm, tm);
      if (temLink) {
        const ab = document.createElement('span'); ab.className = 'abrir';
        ab.textContent = links.length > 1 ? 'Ver ' + links.length + ' opções' : 'Abrir';
        card.appendChild(ab);
      }
      container.appendChild(card);
    });
  }
  montarTurmas();

  // fecha a janela ao clicar fora dela
  janela.addEventListener('click', function (e) { if (e.target === janela) janela.close(); });

  function mudarLayout() {
    const layout = document.getElementById('layoutSelector').value;
    const container = document.getElementById('container');
    container.className = layout;
    try { localStorage.setItem('layoutEscolhido', layout); } catch (e) {}
  }
  // lembra a última escolha do visitante
  (function () {
    try {
      const salvo = localStorage.getItem('layoutEscolhido');
      if (salvo) {
        document.getElementById('layoutSelector').value = salvo;
        mudarLayout();
      }
    } catch (e) {}
  })();
</script>

  <button type="button" id="btnAcess" aria-expanded="false" aria-controls="painelAcess">♿ Acessibilidade</button>
  <div id="painelAcess" role="region" aria-label="Opções de acessibilidade" hidden>
    <h2>Acessibilidade</h2>
    <div class="ac-grupo">
      <div class="ac-linha" role="group" aria-label="Tamanho do texto">
        <button type="button" class="ac-btn centro" id="acMenos" aria-label="Diminuir texto">A−</button>
        <span id="acEscala" aria-live="polite">100%</span>
        <button type="button" class="ac-btn centro" id="acMais" aria-label="Aumentar texto">A+</button>
      </div>
    </div>
    <div class="ac-grupo"><button type="button" class="ac-btn" id="acContraste" aria-pressed="false">Alto contraste<span class="ac-dica">Cores fortes, sem imagem de fundo</span></button></div>
    <div class="ac-grupo"><button type="button" class="ac-btn" id="acCalmo" aria-pressed="false">Modo calmo<span class="ac-dica">Sem brilhos e animações, cores suaves</span></button></div>
    <div class="ac-grupo"><button type="button" class="ac-btn" id="acLeitura" aria-pressed="false">Leitura facilitada<span class="ac-dica">Fonte clara e mais espaço entre letras</span></button></div>
    <div class="ac-grupo"><button type="button" class="ac-btn" id="acVoz" aria-pressed="false">🔊 Ouvir a página<span class="ac-dica">Lê o conteúdo em voz alta</span></button></div>
    <button type="button" class="ac-btn centro" id="acReset">Restaurar padrão</button>
  </div>

<script>
(function () {
  var raiz = document.documentElement;
  var prefs = { escala: 1, contraste: false, calmo: false, leitura: false };
  try { var s = JSON.parse(localStorage.getItem('prefsAcess')); if (s) prefs = Object.assign(prefs, s); } catch (e) {}
  // quem pede menos movimento no sistema já começa no modo calmo
  try { if (localStorage.getItem('prefsAcess') === null && window.matchMedia('(prefers-reduced-motion: reduce)').matches) prefs.calmo = true; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  function salvar() { try { localStorage.setItem('prefsAcess', JSON.stringify(prefs)); } catch (e) {} }
  function aplicar() {
    raiz.style.fontSize = (prefs.escala * 100) + '%';
    raiz.classList.toggle('contraste', prefs.contraste);
    raiz.classList.toggle('calmo', prefs.calmo);
    raiz.classList.toggle('leitura', prefs.leitura);
    $('acEscala').textContent = Math.round(prefs.escala * 100) + '%';
    $('acContraste').setAttribute('aria-pressed', prefs.contraste);
    $('acCalmo').setAttribute('aria-pressed', prefs.calmo);
    $('acLeitura').setAttribute('aria-pressed', prefs.leitura);
    salvar();
  }
  $('btnAcess').onclick = function () {
    var p = $('painelAcess'), abrir = p.hidden;
    p.hidden = !abrir; this.setAttribute('aria-expanded', abrir);
    if (abrir) $('acMais').focus();
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('painelAcess').hidden) { $('painelAcess').hidden = true; $('btnAcess').setAttribute('aria-expanded', false); $('btnAcess').focus(); }
  });
  $('acMais').onclick = function () { prefs.escala = Math.min(1.6, +(prefs.escala + 0.15).toFixed(2)); aplicar(); };
  $('acMenos').onclick = function () { prefs.escala = Math.max(0.85, +(prefs.escala - 0.15).toFixed(2)); aplicar(); };
  $('acContraste').onclick = function () { prefs.contraste = !prefs.contraste; if (prefs.contraste) prefs.calmo = false; aplicar(); };
  $('acCalmo').onclick = function () { prefs.calmo = !prefs.calmo; if (prefs.calmo) prefs.contraste = false; aplicar(); };
  $('acLeitura').onclick = function () { prefs.leitura = !prefs.leitura; aplicar(); };
  $('acReset').onclick = function () { prefs = { escala: 1, contraste: false, calmo: false, leitura: false }; pararVoz(); aplicar(); };

  // leitura em voz alta (usa a voz do próprio aparelho)
  var vozAtiva = false;
  function pararVoz() { if ('speechSynthesis' in window) speechSynthesis.cancel(); vozAtiva = false; $('acVoz').setAttribute('aria-pressed', false); }
  if (!('speechSynthesis' in window)) { $('acVoz').parentNode.hidden = true; }
  $('acVoz').onclick = function () {
    if (vozAtiva) { pararVoz(); return; }
    var texto = document.querySelector('.hero').innerText + '. Turmas: ' +
      Array.prototype.map.call(document.querySelectorAll('#container .turma'), function (t) { return t.innerText.replace(/\n+/g, '. '); }).join('. ');
    var u = new SpeechSynthesisUtterance(texto); u.lang = 'pt-BR';
    u.onend = u.onerror = function () { vozAtiva = false; $('acVoz').setAttribute('aria-pressed', false); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    vozAtiva = true; this.setAttribute('aria-pressed', true);
  };
  aplicar();
})();
</script>
