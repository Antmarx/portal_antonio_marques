/* Cada questão: [enunciado, resposta correta, [3 alternativas erradas], dica, explicação] */
var BANCO={
1:[
["Segundo o material, a Contabilidade é a ciência que:","estuda, registra e interpreta os fenômenos que afetam o patrimônio das entidades",["apenas calcula os impostos devidos pela empresa","cuida somente da cobrança de clientes","trata exclusivamente da contratação de pessoal"],"Pense em patrimônio: registrar e interpretar.","A Contabilidade estuda, registra e interpreta os fenômenos que afetam o patrimônio das entidades (Marion, 2018)."],
["Qual é o objetivo essencial da Contabilidade, segundo Marion (2018)?","Fornecer informações econômico-financeiras úteis para a tomada de decisão",["Aumentar o lucro da empresa a qualquer custo","Substituir o trabalho do administrador","Cobrar impostos dos contribuintes"],"Informação útil para decidir.","O objetivo é fornecer informações úteis a usuários internos (gestores) e externos (investidores, credores, fisco)."],
["Qual alternativa lista apenas usuários EXTERNOS da informação contábil?","Investidores, credores e fisco",["Gestores, gerentes e diretores da empresa","Gestores e credores","Investidores e gestores"],"Externos ficam fora da gestão da empresa.","Usuários internos são os gestores; externos são investidores, credores e fisco."],
["Quem sistematizou o método das partidas dobradas, em 1494?","Frei Luca Pacioli",["Max Weber","Adam Smith","Sérgio de Iudícibus"],"Foi um frade italiano do século XV.","Frei Luca Pacioli sistematizou, em 1494, o método que fundamenta a contabilidade até hoje."],
["Qual é o princípio básico das partidas dobradas?","Para todo débito há um crédito de igual valor",["Toda despesa gera uma receita de igual valor","Todo lucro deve ser distribuído aos sócios","Toda compra deve ser paga à vista"],"Dois lados que sempre se equilibram.","Nas partidas dobradas, cada lançamento tem débito e crédito de mesmo valor, mantendo a equação patrimonial em equilíbrio."],
["Qual função da Contabilidade apoia o gestor no acompanhamento dos recursos, prevenindo desvios?","Função de controle",["Função registradora","Função informativa","Função tributária"],"Controlar é acompanhar para evitar desvios.","A função de controle apoia o gestor, previne desvios e subsidia decisões estratégicas e operacionais."],
["A função registradora da Contabilidade consiste em:","capturar e registrar, de forma sistemática e cronológica, todos os fatos que afetam o patrimônio",["produzir relatórios para investidores","prevenir desvios e fraudes","calcular os impostos dos clientes"],"Registradora = registrar.","Registrar os fatos de modo sistemático e cronológico é a função registradora."],
["Segundo o material, o patrimônio é o conjunto de:","bens, direitos e obrigações avaliados economicamente",["receitas, despesas e lucros do período","apenas bens e dinheiro em caixa","ativos e despesas pagas"],"São três elementos.","Patrimônio é o conjunto de bens, direitos e obrigações de uma entidade avaliados economicamente."],
["Qual é exemplo de bem INTANGÍVEL?","Marca registrada da empresa",["Estoque de mercadorias","Veículo da empresa","Dinheiro em caixa"],"Intangível não pode ser tocado.","Marcas, patentes, softwares e fundo de comércio são bens intangíveis."],
["Qual item é um DIREITO da empresa?","Duplicatas a receber de clientes",["Salários a pagar","Dívida com fornecedor","Impostos a pagar"],"Direito = valor a receber.","Direitos são valores a receber, como duplicatas a receber, empréstimos concedidos e depósitos bancários."],
["O Patrimônio Líquido (PL) é calculado por:","Ativo − Passivo",["Ativo + Passivo","Passivo − Ativo","Receitas − Despesas"],"É a riqueza própria dos sócios.","PL = Ativo − Passivo; representa a riqueza própria dos sócios."],
["O que AUMENTA o Patrimônio Líquido?","Receitas de vendas e investimentos dos sócios (capital integralizado)",["Despesas administrativas e retiradas dos sócios","Prejuízos acumulados nas operações","Distribuição de lucros e pagamento de pró-labore"],"Pense no que entra de riqueza.","Receitas e investimentos dos sócios aumentam o PL; despesas, custos e retiradas o diminuem."],
["Qual é a diferença entre fato e ato administrativo?","O fato já ocorreu e modifica o patrimônio; o ato é compromisso ainda sem efeito patrimonial",["O ato modifica o patrimônio; o fato é apenas uma intenção","Os dois sempre alteram o Patrimônio Líquido","Fato envolve só dinheiro; ato envolve só mercadorias"],"Um já aconteceu; o outro é só compromisso.","Fato administrativo já ocorreu e modifica o patrimônio; ato administrativo (ex.: assinar contrato) ainda não gerou efeito contábil."],
["Fatos permutativos são aqueles que:","trocam elementos do patrimônio sem alterar o Patrimônio Líquido",["aumentam o Patrimônio Líquido","diminuem o Patrimônio Líquido","são apenas compromissos futuros sem efeito"],"Permutar é trocar.","Fatos permutativos trocam elementos sem alterar o PL, como a compra de estoque à vista."],
["As contas de resultado (receitas e despesas) são encerradas:","ao final de cada exercício, contra o Patrimônio Líquido",["nunca, pois têm saldo permanente","a cada venda realizada","somente quando a empresa fecha as portas"],"Quem tem saldo permanente são as patrimoniais.","Contas de resultado são encerradas ao final de cada exercício contra o PL; as patrimoniais têm saldo permanente."],
["O Livro Diário é:","o registro cronológico de todos os fatos contábeis, em ordem de data",["o agrupamento dos lançamentos por conta, com o saldo de cada uma","a conferência entre débitos e créditos antes das demonstrações","o relatório que apura lucro ou prejuízo"],"Diário = dia a dia.","O Diário registra cronologicamente os fatos, com débito, crédito, data e histórico."],
["Qual é a finalidade do Balancete de Verificação?","Conferir se débitos e créditos estão em equilíbrio antes das demonstrações",["Apurar o lucro distribuído aos sócios","Registrar a assinatura de contratos","Calcular os impostos sobre vendas"],"É uma conferência antes do fechamento.","O Balancete confirma que débitos = créditos antes da elaboração das demonstrações contábeis."],
["O Balanço Patrimonial é comparado a uma:","fotografia da empresa em determinada data",["filme do desempenho durante o exercício","previsão do orçamento do próximo ano","lista dos clientes inadimplentes"],"Posição estática, num único momento.","O Balanço mostra a posição estática do patrimônio numa data específica: uma “fotografia”."],
["A DRE é descrita como um “filme” porque:","mostra receitas e despesas durante um período, apurando lucro ou prejuízo",["mostra o patrimônio em uma única data","lista apenas o dinheiro em caixa","registra somente os atos administrativos"],"Filme = movimento ao longo do tempo.","A DRE apresenta de forma dinâmica as receitas e despesas de um período (Iudícibus; Marion, 2019)."],
["No regime de competência, a DRE reconhece receitas e despesas:","quando ocorrem, mesmo que o dinheiro ainda não tenha entrado ou saído",["somente quando o dinheiro entra ou sai do caixa","apenas no último dia do exercício","apenas quando a nota fiscal já foi paga"],"Competência é diferente de caixa.","Na competência reconhece-se o fato quando ocorre; a DFC, pelo regime de caixa, registra só o dinheiro efetivo."],
["As três atividades apresentadas na Demonstração dos Fluxos de Caixa (DFC) são:","operacionais, de investimento e de financiamento",["circulantes, não circulantes e patrimoniais","comerciais, tributárias e trabalhistas","receitas, despesas e resultados"],"Operar, investir e financiar.","A DFC separa as entradas e saídas de caixa em atividades operacionais, de investimento e de financiamento."],
["A liquidez corrente (Ativo Circulante ÷ Passivo Circulante) mede:","a capacidade de pagar dívidas de curto prazo",["o percentual de lucro sobre cada real vendido","o retorno sobre o capital dos sócios","quanto do ativo foi financiado por terceiros"],"Curto prazo = até 12 meses.","Liquidez corrente mede a capacidade de pagar dívidas de curto prazo; o ideal é acima de 1,0."],
["Na conta T, o débito representa:","apenas o lado esquerdo da conta, e não necessariamente uma dívida",["sempre uma dívida da empresa com terceiros","sempre uma entrada de dinheiro","sempre uma despesa"],"Débito não é sinônimo de dívida.","Débito ≠ dívida: é apenas o lado esquerdo da conta T."]
],
2:[
["Uma empresa tem Ativo de R$ 100.000 e Passivo de R$ 30.000. Qual é o Patrimônio Líquido?","R$ 70.000",["R$ 130.000","R$ 30.000","R$ 100.000"],"PL = Ativo − Passivo.","100.000 − 30.000 = R$ 70.000, riqueza própria dos sócios."],
["Uma mercearia de Vera Cruz abre com capital de R$ 20.000 em dinheiro. Qual o efeito na equação patrimonial?","Ativo aumenta R$ 20.000 e PL aumenta R$ 20.000",["Ativo aumenta R$ 20.000 e Passivo aumenta R$ 20.000","Ativo diminui R$ 20.000 e PL aumenta R$ 20.000","Somente o Passivo aumenta R$ 20.000"],"O capital é investimento dos sócios.","O dinheiro entra no Caixa (Ativo) e o capital dos sócios aumenta o PL."],
["A mercearia compra estoque a prazo por R$ 5.000. Qual o efeito?","Ativo +R$ 5.000 e Passivo +R$ 5.000; o PL não muda",["Ativo +R$ 5.000 e PL +R$ 5.000","Ativo −R$ 5.000 e Passivo +R$ 5.000","Ativo +R$ 5.000 e PL −R$ 5.000"],"A dívida com o fornecedor vai para o Passivo.","O estoque aumenta o Ativo e a dívida aumenta o Passivo, mantendo o equilíbrio e o PL."],
["A mercearia paga aluguel de R$ 800 em dinheiro. Qual o efeito?","Ativo −R$ 800 e PL −R$ 800 (fato modificativo diminutivo)",["Ativo −R$ 800 e Passivo −R$ 800 (permutativo)","Ativo +R$ 800 e PL +R$ 800","Nenhum efeito, pois é apenas um ato administrativo"],"Despesa reduz o PL.","O Caixa diminui e a despesa de aluguel reduz o PL."],
["Venda à vista de R$ 3.000 de mercadorias que custaram R$ 2.000. De quanto é o aumento do PL?","R$ 1.000",["R$ 3.000","R$ 2.000","R$ 5.000"],"O PL aumenta pelo ganho, não pelo valor total.","Receita de R$ 3.000 menos custo de R$ 2.000 resulta em aumento de R$ 1.000 no PL."],
["Lançamento da venda de mercadorias à vista por R$ 2.000:","D – Caixa (Ativo) / C – Receita de Vendas, R$ 2.000",["D – Receita de Vendas / C – Caixa, R$ 2.000","D – Caixa / C – Fornecedores, R$ 2.000","D – Estoque / C – Caixa, R$ 2.000"],"Caixa aumenta (débito); receita aumenta (crédito).","Ativo aumenta com débito; receita aumenta com crédito."],
["Compra de mercadorias a prazo por R$ 4.000. Qual é o lançamento?","D – Estoque (Ativo) / C – Fornecedores (Passivo)",["D – Fornecedores / C – Estoque","D – Caixa / C – Estoque","D – Despesas / C – Caixa"],"Ativo aumenta no débito; Passivo aumenta no crédito.","O estoque aumenta (débito no Ativo) e a dívida com o fornecedor aumenta (crédito no Passivo)."],
["Integralização de capital pelo sócio, R$ 15.000 em dinheiro. Qual é o lançamento?","D – Caixa / C – Capital Social",["D – Capital Social / C – Caixa","D – Caixa / C – Receita de Vendas","D – Fornecedores / C – Caixa"],"O Caixa aumenta e o PL aumenta.","O Caixa (Ativo) aumenta com débito e o Capital Social (PL) aumenta com crédito."],
["Pagamento de aluguel de R$ 1.200 em dinheiro. Qual é o lançamento?","D – Despesa de Aluguel / C – Caixa",["D – Caixa / C – Despesa de Aluguel","D – Aluguel a Pagar / C – Receita","D – Capital Social / C – Caixa"],"Despesa aumenta com débito.","A despesa aumenta (débito) e o Caixa diminui (crédito)."],
["Pagamento de R$ 4.000 ao fornecedor, em dinheiro. Qual é o lançamento?","D – Fornecedores (Passivo) / C – Caixa (Ativo)",["D – Caixa / C – Fornecedores","D – Despesa / C – Fornecedores","D – Estoque / C – Caixa"],"A dívida diminui e o caixa também.","Passivo diminui com débito; Ativo diminui com crédito."],
["Na conta T do Caixa há entradas de R$ 5.000 e saídas de R$ 2.000. Qual é o saldo?","R$ 3.000 devedor",["R$ 3.000 credor","R$ 7.000 devedor","R$ 2.000 devedor"],"Entradas ficam no débito.","5.000 − 2.000 = R$ 3.000, saldo devedor (D)."],
["Pagamento de salários dos funcionários é:","fato modificativo diminutivo",["fato permutativo","fato modificativo aumentativo","ato administrativo"],"O dinheiro sai e o PL diminui.","O pagamento de salários é despesa: reduz o PL."],
["Assinatura de contrato de fornecimento com a distribuidora, sem entrega ainda, é:","ato administrativo, pois ainda não alterou o patrimônio",["fato permutativo","fato modificativo aumentativo","fato modificativo diminutivo"],"Compromisso sem efeito patrimonial.","Contratos assinados e pedidos realizados são atos administrativos: ainda não geraram efeito contábil."],
["Recebimento de aluguel de imóvel da empresa é:","fato modificativo aumentativo, pois gera receita",["fato permutativo","fato modificativo diminutivo","ato administrativo"],"Receita aumenta o PL.","O recebimento gera receita e aumenta o PL."],
["Uma mercearia tem Ativo de R$ 30.000 e Passivo Circulante de R$ 8.000. Qual é o PL?","R$ 22.000",["R$ 38.000","R$ 8.000","R$ 30.000"],"PL = Ativo − Passivo.","30.000 − 8.000 = R$ 22.000."],
["Receita Bruta de R$ 50.000 e deduções de R$ 5.000. Qual é a Receita Líquida?","R$ 45.000",["R$ 55.000","R$ 50.000","R$ 5.000"],"Receita líquida = bruta − deduções.","50.000 − 5.000 = R$ 45.000."],
["Receita Líquida de R$ 45.000 e CMV de R$ 28.000. Qual é o Lucro Bruto?","R$ 17.000",["R$ 73.000","R$ 28.000","R$ 45.000"],"Lucro bruto = receita líquida − CMV.","45.000 − 28.000 = R$ 17.000."],
["Lucro Bruto de R$ 17.000 e despesas operacionais de R$ 10.000. Qual é o Lucro Líquido do exercício?","R$ 7.000",["R$ 27.000","R$ 10.000","R$ 17.000"],"Desconte as despesas do lucro bruto.","17.000 − 10.000 = R$ 7.000."],
["Hortifrúti: receita bruta R$ 30.000; impostos s/ vendas R$ 2.700; CMV R$ 18.000; aluguel R$ 1.200; salários R$ 3.000; energia R$ 600. Qual é o Lucro Líquido?","R$ 4.500",["R$ 9.300","R$ 7.200","R$ 5.100"],"Receita líquida − CMV − despesas.","30.000 − 2.700 = 27.300; − 18.000 = 9.300 (lucro bruto); − 4.800 de despesas = R$ 4.500."],
["Ativo Circulante de R$ 16.000 e Passivo Circulante de R$ 8.000. Qual é a liquidez corrente e o que ela indica?","2,0 — boa capacidade de pagamento no curto prazo",["0,5 — capacidade insuficiente de pagamento","2,0 — empresa excessivamente endividada","8,0 — a empresa tem muito mais dívidas que bens"],"Divida o Ativo Circulante pelo Passivo Circulante.","16.000 ÷ 8.000 = 2,0, acima do ideal de 1,0."],
["Lucro líquido de R$ 7.000 e receita líquida de R$ 45.000. Qual é a margem líquida, aproximadamente?","15,6%",["37,8%","31,8%","6,4%"],"Lucro líquido ÷ receita líquida × 100.","7.000 ÷ 45.000 × 100 ≈ 15,6%."],
["Lucro líquido de R$ 7.000 e PL de R$ 22.000. Qual é a rentabilidade do PL, aproximadamente?","31,8%",["15,6%","3,1%","7,0%"],"Lucro líquido ÷ PL × 100.","7.000 ÷ 22.000 × 100 ≈ 31,8%."],
["Passivo total de R$ 8.000 e Ativo total de R$ 30.000. Qual é o endividamento e a leitura (ideal: abaixo de 0,5)?","0,27 — abaixo de 0,5, endividamento controlado",["3,75 — endividamento altíssimo","0,73 — endividamento controlado","0,27 — acima do ideal, pois o ideal é maior que 0,5"],"Passivo total ÷ Ativo total.","8.000 ÷ 30.000 ≈ 0,27, abaixo do limite de 0,5."],
["A mercearia vendeu R$ 10.000 a prazo e ainda não recebeu. O que acontece nas demonstrações?","A DRE reconhece a receita (competência), mas a DFC só registra no recebimento",["A DFC registra a entrada de R$ 10.000 agora, mas a DRE não","Nem a DRE nem a DFC registram nada","A DRE e a DFC registram R$ 10.000 agora"],"Competência x caixa.","A DRE usa o regime de competência; a DFC registra só o dinheiro que efetivamente entrou."],
["Uma cooperativa capta um empréstimo bancário para ampliar a produção. Em qual atividade da DFC entra esse recurso?","Atividades de financiamento",["Atividades operacionais","Atividades de investimento","Não entra na DFC"],"Empréstimos captados têm uma atividade própria.","Empréstimos captados, amortizações, integralizações e dividendos são atividades de financiamento."],
["Uma cooperativa compara o orçamento semestral (planejado) com o resultado real da contabilidade. Para que serve?","Identificar desvios, corrigir rumos e melhorar as projeções futuras",["Substituir a escrituração contábil","Calcular o Balanço sem fazer lançamentos","Evitar o pagamento de impostos"],"Planejado x realizado.","A comparação orçamento × realizado alimenta a melhoria contínua da gestão financeira."],
["Uma empresa tem lucro na DRE, mas está sem dinheiro no caixa. Qual é a explicação mais provável?","Vendeu a prazo: a receita foi reconhecida na DRE, mas o dinheiro ainda não entrou",["A DRE está sempre errada quando há lucro","Lucro contábil e caixa são sempre iguais","A empresa não precisa elaborar a DFC"],"Pense em venda a prazo.","Pelo regime de competência a receita aparece na DRE; o caixa só recebe no pagamento."]
]};

function novoEstado(){return{nome:"",email:"",n:1,q:[],r:[],i:0,res:{1:null,2:null},ativo:false,vistas:{1:{},2:{}}}}
var S=novoEstado();
var avisoPend=false,musicaOn=false;

function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function emb(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function falar(m){var s=$("status");s.textContent="";setTimeout(function(){s.textContent=m},60)}
function foco(id){var e=$(id);if(e&&e.focus)e.focus()}
function reduzido(){return window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches}
function reinicios(){try{return parseInt(sessionStorage.getItem("reiniciosD"),10)||0}catch(e){return 0}}

function steps(){var h='<div class="steps" aria-label="Etapas do quiz">';[1,2].forEach(function(n){var c=S.res[n]?"done":(S.n===n?"on":"");h+='<div class="step '+c+'">'+(S.res[n]?"✅ ":"")+"Quiz "+n+" · "+(n===1?"Conceitos":"Casos práticos")+"</div>"});return h+"</div>"}

function inicio(){
  $("app").innerHTML='<form onsubmit="comecar();return false" novalidate>'+
  '<label class="f" for="nm">👤 Nome completo</label><input type="text" id="nm" autocomplete="name" placeholder="Digite seu nome completo">'+
  '<label class="f" for="em">📧 E-mail</label><input type="email" id="em" autocomplete="email" placeholder="seu.email@exemplo.com">'+
  '<p class="erro" id="err" role="alert"></p>'+
  '<div class="msg">📋 São <b>2 quizzes de 8 questões</b> (Quiz 1: conceitos; Quiz 2: casos práticos), sorteadas e embaralhadas a cada tentativa. Ao refazer, você recebe questões novas sempre que possível. O <b>Quiz 2 só libera após concluir o Quiz 1</b>. Ao final de cada quiz você vê o gabarito comentado, pode refazer e enviar o print do resultado (parcial ou total).<br>🎵 <b>Trilha sonora opcional:</b> use o botão <b>Música</b> no alto da página para ligar ou desligar.<br>⚠️ <b>Não saia da página durante o quiz:</b> se trocar de aba, minimizar ou abrir outro aplicativo, você volta à tela de login e <b>recomeça tudo</b>, com novas questões.</div>'+
  '<button class="btn" type="submit">▶ Iniciar Quiz 1</button></form>';
}
function comecar(){
  var n=$("nm").value.trim(),e=$("em").value.trim();
  if(n.length<3||e.indexOf("@")<1||e.indexOf(".")<0){$("err").textContent="Preencha o nome completo e um e-mail válido.";falar("Preencha o nome completo e um e-mail válido.");foco(n.length<3?"nm":"em");return}
  S.nome=n;S.email=e;iniciar(1);
}

/* Sorteio: prioriza questões ainda não vistas; só repete quando o banco se esgota */
function sortear(n){
  var pool=BANCO[n].map(function(x,i){return i}),v=S.vistas[n];
  var novas=emb(pool.filter(function(i){return !v[i]})),sel;
  if(novas.length>=NQ){sel=novas.slice(0,NQ)}
  else{var resto=emb(pool.filter(function(i){return v[i]})).slice(0,NQ-novas.length);sel=novas.concat(resto);S.vistas[n]={}}
  sel.forEach(function(i){S.vistas[n][i]=1});
  return emb(sel).map(function(i){var x=BANCO[n][i];return{t:x[0],o:emb([x[1]].concat(x[2])),c:x[1],d:x[3],e:x[4]}});
}
function iniciar(n){S.n=n;S.q=sortear(n);S.r=[];S.i=0;S.ativo=true;quest()}

function quest(){
  var q=S.q[S.i],p=Math.round(S.i/NQ*100);
  var h=steps()+'<div style="color:var(--mut);font-size:.9em">Quiz '+S.n+' · Questão '+(S.i+1)+' de '+NQ+'</div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'" aria-label="Progresso do quiz"><i style="width:'+p+'%"></i></div><h2 class="q" id="qt" tabindex="-1">'+esc(q.t)+'</h2><div role="radiogroup" aria-labelledby="qt" id="ops">';
  q.o.forEach(function(o,k){var on=S.r[S.i]===o;h+='<button type="button" class="op'+(on?" sel":"")+'" role="radio" aria-checked="'+on+'" onclick="escolher('+k+')"><b>'+"ABCD"[k]+")</b><span>"+esc(o)+"</span></button>"});
  h+='</div><div class="dica" id="dc" role="note">💡 '+esc(q.d)+'</div>';
  h+='<button type="button" class="btn sec" id="bd" aria-expanded="false" aria-controls="dc" onclick="dica()">💡 Dica</button> ';
  if(S.i>0)h+='<button type="button" class="btn sec" onclick="S.i--;quest()">← Anterior</button> ';
  h+='<button type="button" class="btn" id="bn" '+(S.r[S.i]===undefined?"disabled":"")+' onclick="prox()">'+(S.i===NQ-1?"Finalizar ✔":"Próxima →")+"</button>";
  h+='<p class="atalhos">⌨️ Atalhos: teclas 1 a 4 (ou A a D) escolhem a resposta; seta → avança; seta ← volta.</p>';
  $("app").innerHTML=h;foco("qt");
}
function escolher(k){
  S.r[S.i]=S.q[S.i].o[k];
  var bs=document.querySelectorAll("#ops .op");
  for(var j=0;j<bs.length;j++){var on=(j===k);bs[j].classList.toggle("sel",on);bs[j].setAttribute("aria-checked",on?"true":"false")}
  $("bn").disabled=false;falar("Alternativa "+"ABCD"[k]+" selecionada.");
}
function dica(){var d=$("dc"),b=$("bd"),ver=d.style.display!=="block";d.style.display=ver?"block":"none";b.setAttribute("aria-expanded",ver?"true":"false");if(ver)falar("Dica: "+S.q[S.i].d)}
function prox(){if(S.i<NQ-1){S.i++;quest()}else fim()}

function status(p){return p>=70?["Meta atingida","#2f855a"]:p>=50?["Quase lá – revise e refaça","#c05621"]:["Refazer recomendado","#c53030"]}
function fim(){
  S.ativo=false;
  var a=0,it=S.q.map(function(q,i){var ok=S.r[i]===q.c;if(ok)a++;return{t:q.t,r:S.r[i],c:q.c,e:q.e,ok:ok}});
  S.res[S.n]={a:a,t:NQ,p:Math.round(a/NQ*100),it:it,dt:new Date().toLocaleString("pt-BR")};
  resultado(S.n);
}
function resultado(n){
  S.n=n;var r=S.res[n],st=status(r.p);
  var h=steps()+'<h2 class="q" id="rt" tabindex="-1">🏁 Quiz '+n+' concluído: '+r.a+" / "+r.t+" ("+r.p+'%) <span class="tag" style="background:'+st[1]+'">'+st[0]+'</span></h2><h3>📖 Gabarito comentado</h3>';
  r.it.forEach(function(x,i){h+='<div class="gab '+(x.ok?"c":"e")+'"><b>'+(x.ok?"✅ Correta":"❌ Incorreta")+" · "+(i+1)+". "+esc(x.t)+"</b><br>Sua resposta: "+esc(x.r)+(x.ok?"":"<br>Resposta correta: <b>"+esc(x.c)+"</b>")+'<div class="ex">📌 '+esc(x.e)+"</div></div>"});
  h+='<button type="button" class="btn sec" onclick="iniciar('+n+')">🔄 Refazer Quiz '+n+" (novas questões)</button> ";
  if(n===1)h+='<button type="button" class="btn ok" onclick="iniciar(2)">➡ Ir para o Quiz 2</button>';
  h+='<h3>📤 Enviar resultado</h3><button type="button" class="btn" onclick="envio(\'PARCIAL\')">📸 Enviar PARCIAL (Quiz 1)</button> ';
  h+=S.res[1]&&S.res[2]?'<button type="button" class="btn ok" onclick="envio(\'TOTAL\')">📸 Enviar TOTAL (Quiz 1 + 2)</button>':'<button type="button" class="btn" disabled>📸 Enviar TOTAL (conclua os 2 quizzes)</button>';
  h+='<div id="envio"></div>';
  $("app").innerHTML=h;window.scrollTo(0,0);foco("rt");
}

function linha(k,v){return '<div class="row"><span>'+k+"</span><b>"+v+"</b></div>"}
function envio(tipo){
  var r1=S.res[1],r2=S.res[2],tot=tipo==="TOTAL",a=tot?r1.a+r2.a:r1.a,t=tot?16:8,p=Math.round(a/t*100),st=status(p),sd="Reinícios por saída da página: "+reinicios();
  S.pl={tipo:tipo,aluno:S.nome,email:S.email,dt:new Date().toLocaleString("pt-BR"),q1:r1.a+" / 8",q2:tot?r2.a+" / 8":"—",total:a+" / "+t,perc:p+"%",status:st[0],saidas:sd};
  var h='<div class="cartao" id="cartao"><h2>📊 Contabilidade Geral — Turma D<br><span class="tag" style="background:'+(tot?"#2f855a":"#c05621")+'">ENVIO '+tipo+(tot?" · Quiz 1 + Quiz 2":" · somente Quiz 1")+"</span></h2>"+
  linha("👤 Aluno",esc(S.nome))+linha("📧 E-mail",esc(S.email))+linha("📅 Data/hora",S.pl.dt)+
  linha("Quiz 1 – Conceitos",r1.a+" / 8 ("+r1.p+"%)")+linha("Quiz 2 – Casos práticos",tot?r2.a+" / 8 ("+r2.p+"%)":"não enviado neste envio")+
  linha("🏆 Nota "+(tot?"total":"parcial"),"<b>"+a+" / "+t+" ("+p+"%)</b>")+linha("Status",st[0])+linha("🚪 Reinícios por saída da página",reinicios())+"</div>";
  h+='<button type="button" class="btn ok" id="bt" onclick="enviar_(\''+tipo+'\')">📤 Enviar para a pasta do Drive ('+tipo+')</button><div id="img" role="status" aria-live="polite"></div><div class="msg">O envio é feito automaticamente para a pasta do professor, com o nome <b>'+tipo+'_'+esc(S.nome.replace(/\s+/g,"_"))+'</b>. Se falhar, a imagem será exibida para você salvar.<br>'+(DRIVE?'<a href="'+DRIVE+'" target="_blank" rel="noopener"><button class="btn sec" type="button">📁 Abrir pasta do Drive (alternativa manual)</button></a>':"")+'</div>';
  $("envio").innerHTML=h;$("cartao").scrollIntoView({behavior:reduzido()?"auto":"smooth"});
}
function enviar_(tipo){
  var b=$("img"),bt=$("bt");bt.disabled=true;b.innerHTML="⏳ Gerando imagem e enviando…";
  if(!window.html2canvas){b.innerHTML="Não foi possível gerar a imagem. Tire um print da tela e envie pela pasta do Drive.";bt.disabled=false;return}
  html2canvas($("cartao"),{scale:2,backgroundColor:"#ffffff"}).then(function(c){
    var u=c.toDataURL("image/png"),nome=tipo+"_"+S.nome.replace(/\s+/g,"_")+"_"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
    var pre='<img src="'+u+'" alt="Cartão de resultado" style="max-width:100%;border-radius:10px;border:1px solid var(--bd);margin-top:8px">';
    fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({nome:nome,imagem:u,turma:TURMA,atividade:ATIVIDADE},S.pl))})
    .then(function(){b.innerHTML='<div class="msg">✅ <b>Envio '+tipo+' realizado!</b> O resultado foi enviado para a pasta do professor como <b>'+esc(nome)+'.png</b>.'+pre+"</div>";bt.disabled=false;bt.textContent="📤 Reenviar ("+tipo+")"})
    .catch(function(){b.innerHTML='<div class="msg">⚠️ Não foi possível enviar automaticamente. Salve a imagem abaixo (segure/botão direito) e envie pela pasta do Drive.'+pre+"</div>";bt.disabled=false})
  }).catch(function(){b.innerHTML="Falha ao gerar a imagem. Tire um print da tela.";bt.disabled=false})
}

/* ---------- Acessibilidade ---------- */
function fonte(d){var s=parseFloat(getComputedStyle(document.body).fontSize);document.body.style.fontSize=Math.min(26,Math.max(13,s+d*2))+"px"}
function contraste(){var on=document.body.classList.toggle("contraste");$("btCon").setAttribute("aria-pressed",on?"true":"false")}
function ler(){
  if(!window.speechSynthesis)return;speechSynthesis.cancel();
  var t;
  if(S.ativo&&$("qt")){var q=S.q[S.i];t=q.t+". "+q.o.map(function(o,k){return "Alternativa "+"ABCD"[k]+": "+o}).join(". ")}
  else t=$("app").innerText;
  var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";
  u.onstart=function(){baixar(true)};u.onend=u.onerror=function(){baixar(false)};
  speechSynthesis.speak(u);
}

/* ---------- Música (trilha opcional) ---------- */
function volume(){return (+$("vol").value)/100}
function baixar(on){if(musicaOn)$("trilha").volume=on?volume()*0.25:volume()}
function atualizaMus(){var b=$("btMus");b.setAttribute("aria-pressed",musicaOn?"true":"false");b.textContent=musicaOn?"🎵 Música: ligada":"🎵 Música: desligada";$("volLbl").style.display=musicaOn?"inline-flex":"none"}
function musica(){
  var a=$("trilha");
  if(!musicaOn){
    if(!a.getAttribute("src"))a.src=MUSICA;
    a.volume=volume();musicaOn=true;atualizaMus();
    var pr=a.play();
    if(pr&&pr.catch)pr.catch(function(){musicaOn=false;atualizaMus();falar("Não foi possível tocar a música.")});
    falar("Música ligada.");
  }else{pararMusica();falar("Música desligada.")}
}
function pararMusica(){var a=$("trilha");try{a.pause()}catch(e){}musicaOn=false;atualizaMus()}
$("vol").addEventListener("input",function(){if(musicaOn)$("trilha").volume=volume()});
$("trilha").addEventListener("error",function(){if(musicaOn){musicaOn=false;atualizaMus();falar("Arquivo de música não encontrado.")}});

/* ---------- Aviso (janela de diálogo) ---------- */
function aviso(m){
  var a=$("av");if(a)a.remove();
  a=document.createElement("div");a.id="av";a.setAttribute("role","alertdialog");a.setAttribute("aria-modal","true");a.setAttribute("aria-labelledby","avt");
  a.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";
  a.innerHTML='<div class="wrap" style="max-width:440px;text-align:center"><p id="avt" style="font-size:1.1em;line-height:1.5">'+m+'</p><button type="button" class="btn" id="avb" onclick="fecharAviso()">Entendi</button></div>';
  document.body.appendChild(a);foco("avb");
}
function fecharAviso(){var a=$("av");if(a)a.remove();foco("nm")}

/* ---------- Saiu da página: volta ao login e recomeça tudo ---------- */
function reiniciarTudo(){
  try{speechSynthesis.cancel()}catch(e){}
  pararMusica();
  try{sessionStorage.setItem("reiniciosD",String(reinicios()+1))}catch(e){}
  S=novoEstado();inicio();
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(S.ativo){reiniciarTudo();avisoPend=true}}
  else if(avisoPend){avisoPend=false;aviso("🔄 Você saiu da página durante o quiz. Por isso, <b>tudo foi reiniciado</b>: faça o login novamente. As questões serão sorteadas de novo.")}
});

/* ---------- Atalhos de teclado ---------- */
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&$("av")){fecharAviso();return}
  if(e.ctrlKey||e.altKey||e.metaKey||$("av"))return;
  var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(!S.ativo||!$("ops"))return;
  var k=(e.key||"").toLowerCase(),idx=-1;
  if(k.length===1&&"1234".indexOf(k)>-1)idx=+k-1;else if(k.length===1&&"abcd".indexOf(k)>-1)idx=k.charCodeAt(0)-97;
  if(idx>=0){escolher(idx);var b=document.querySelectorAll("#ops .op")[idx];if(b)b.focus();e.preventDefault();return}
  if(e.key==="ArrowRight"&&!$("bn").disabled){prox();e.preventDefault()}
  else if(e.key==="ArrowLeft"&&S.i>0){S.i--;quest();e.preventDefault()}
});

inicio();
</script>
