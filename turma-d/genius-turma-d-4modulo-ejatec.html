<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Genius Interdisciplinar · Turma D</title>
<style>
:root{--bg:#0f0c29;--card:#1b1747;--tx:#f4f1ff;--mu:#bdb6e8;--ac:#ffc36b;--ok:#4be39a;--er:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#3a2f86,#0f0c29 60%);color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:16px;font-size:1rem;line-height:1.5}
body.ct{--bg:#000;--card:#000;--tx:#fff;--mu:#ffee00;--ac:#ffee00}
main{width:100%;max-width:760px;background:var(--card);border:2px solid #4b43a8;border-radius:24px;padding:24px;height:fit-content;box-shadow:0 20px 50px #0009}
h1{font-size:1.5rem;line-height:1.2}h2{font-size:1.2rem;margin:14px 0 6px;color:var(--ac)}p,li{color:var(--mu)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:.88rem;color:var(--mu)}
.tg{display:inline-block;border:2px solid var(--ac);color:var(--ac);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
ol{padding-left:20px}li{margin:4px 0}
label{display:block;margin-top:12px;font-weight:700}
input,textarea{width:100%;font:inherit;color:#fff;background:#0d0a2e;border:2px solid #5a50c8;border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:170px;resize:vertical}
.b{font:inherit;font-weight:800;min-height:48px;padding:10px 20px;border-radius:14px;border:0;cursor:pointer;background:var(--ac);color:#1a1440;margin-top:14px}
.b.s{background:transparent;color:var(--tx);border:2px solid #5a50c8}.b:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(78vw,340px);margin:14px auto;position:relative}
.pad{aspect-ratio:1;border:0;cursor:pointer;opacity:.38;transition:opacity .12s,transform .12s,filter .12s}
.pad.on{opacity:1;filter:brightness(1.4) drop-shadow(0 0 18px currentColor);transform:scale(1.03)}
.pad:nth-child(1){background:#2ecc71;color:#2ecc71;border-radius:100% 8px 8px 8px}.pad:nth-child(2){background:#e74c3c;color:#e74c3c;border-radius:8px 100% 8px 8px}
.pad:nth-child(3){background:#f1c40f;color:#f1c40f;border-radius:8px 8px 8px 100%}.pad:nth-child(4){background:#3498db;color:#3498db;border-radius:8px 8px 100% 8px}
.pads.off .pad{pointer-events:none}
.msg{min-height:3em;text-align:center;font-weight:700;color:var(--tx)}
.op{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:#0d0a2e;border:2px solid #5a50c8;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.op:hover{border-color:var(--ac)}.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:700}
.fb.c{background:#12402e;color:var(--ok)}.fb.p{background:#4a3b0e;color:var(--ac)}.fb.e{background:#4a1220;color:var(--er)}
.bar{height:10px;background:#0d0a2e;border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.au{margin-top:18px;padding-top:12px;border-top:1px solid #4b43a8;text-align:center;font-size:.82rem;color:var(--mu)}.au b{color:var(--ac)}
.cv{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:18px;border-radius:20px;background:linear-gradient(135deg,#2b1f7a,#4b2a9a 55%,#8a2f86);border:2px solid #6f62e0}
.dial{width:128px;flex:none}.dial path{opacity:.5;animation:gl 4.8s infinite}.dial path:nth-child(2){animation-delay:.6s}.dial path:nth-child(3){animation-delay:1.2s}.dial path:nth-child(4){animation-delay:1.8s}
@keyframes gl{0%,20%{opacity:1;filter:brightness(1.35)}32%,100%{opacity:.5}}
.cv>div{flex:1;min-width:200px}.cv h1{font-size:1.8rem}.cv p{color:#e6defc;margin-top:4px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}.ch span{background:#0d0a2e;border:2px solid #5a50c8;border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:700;color:var(--tx)}
.s3{display:flex;gap:8px}.s3 span{flex:1;text-align:center;border-radius:12px;background:#0d0a2e;padding:8px 4px;font-size:.85rem;color:var(--mu)}.s3 b{display:block;font-size:1.4rem;color:var(--ac)}
@media(prefers-reduced-motion:reduce){.dial path{animation:none;opacity:1}}
.cnt{font-size:.85rem;color:var(--mu);text-align:right}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{display:none}}
</style>

function resp(v){[].forEach.call(document.querySelectorAll(".op"),function(b){b.disabled=true});S.pts+=v;S.tot+=v;S.hist.push([S.cur[0],v]);
var t=v===1?["c","✅ Resposta completa (1,0)"]:v===.5?["p","◐ Resposta parcial (0,5)"]:["e","❌ Resposta incorreta (0)"];
$("fb").innerHTML='<div class="fb '+t[0]+'">'+t[1]+'</div><button class="b" id="nx">'+(S.k+1<NQ?"Próxima rodada":"Abrir a questão discursiva")+'</button>';$("nx").focus();
$("nx").onclick=function(){S.k++;S.k<NQ?rodada():disc()}}

/* ---------- Discursiva: relevância e envio à planilha ---------- */
function relev(t){var x=norm(t),ok=0;BANCO[S.lv].k.forEach(function(g){if(g.some(function(w){return x.indexOf(w)>-1}))ok++});return Math.round(ok/BANCO[S.lv].k.length*100)}
function disc(av){UL="";ver(cab().replace(/Pergunta.*?pontos/,"Objetivas concluídas · pontos")+'<h2>Questão discursiva · '+esc(BANCO[S.lv].t)+'</h2><p style="color:var(--tx)">'+esc(BANCO[S.lv].p)+'</p>'+(av?'<div class="fb e" role="alert">'+av+'</div>':'')+
'<label for="ds">Sua resposta (mínimo de 15 palavras)</label><textarea id="ds" onpaste="return false" ondrop="return false" autocomplete="off"></textarea><button class="b" id="en" onclick="enviarDisc()">Enviar resposta</button><div id="st"></div>')}
function envia(o){var b=JSON.stringify(Object.assign({turma:TURMA,atividade:ATIVIDADE,aluno:S.nome,email:S.email,nivelAlcancado:S.alc>4?4:S.alc,nota:nota(),dt:new Date().toLocaleString("pt-BR")},o));
try{if(navigator.sendBeacon&&navigator.sendBeacon(API,new Blob([b],{type:"text/plain;charset=utf-8"})))return Promise.resolve()}catch(e){}
try{return fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:b})}catch(e){return Promise.reject(e)}}
function enviarDisc(){var t=$("ds").value.trim();if(t.split(/\s+/).length<15){$("st").innerHTML='<div class="fb e">Escreva pelo menos 15 palavras.</div>';return}
$("en").disabled=true;S.tent++;var r=relev(t),ok=r>MIN*100;if(ok)S.alc=Math.max(S.alc,S.lv+2);
envia({tipo:"NIVEL "+(S.lv+1),nivel:S.lv+1,tentativa:S.tent,objetivas:S.pts.toFixed(1)+" / "+NQ,total:S.tot.toFixed(1),disciplinas:S.hist.map(function(h){return h[0].split(" ")[0]+":"+h[1]}).join(" "),relevancia:r+"%",status:ok?"APROVADA":"REVISAR",discursiva:t}).catch(function(){});
if(ok){S.tent=0;S.lv<3?ver('<h1>🎉 Nível '+(S.lv+1)+' concluído!</h1><p>Relevância da discursiva: <b>'+r+'%</b>. Sua resposta foi enviada ao professor.</p><button class="b" onclick="nivel(S.lv+1)">Ir para o Nível '+(S.lv+2)+'</button>'):final(r)}
else disc('Relevância de '+r+'%: abaixo do mínimo para avançar (mais de '+(MIN*100)+'%). Revise os conceitos das disciplinas e reescreva a resposta.')}
function final(r){S.ativo=false;S.alc=4;var m=NQ*4;envia({tipo:"FINAL",nivelAlcancado:"4 (concluído)",total:S.tot.toFixed(1)+" / "+m,perc:Math.round(S.tot/m*100)+"%",status:"CONCLUIDO"}).catch(function(){});
ver('<h1>🏆 Jogo concluído!</h1><p>Você passou pelos 4 níveis, <b>'+esc(S.nome)+'</b>. Pontos nas objetivas: <b>'+S.tot.toFixed(1)+' de '+m+'</b>. Suas respostas discursivas foram enviadas ao professor Antonio Marques.</p><p>Para jogar de novo, é preciso fazer novo login.</p><button class="b" onclick="inicio()">Voltar ao início</button>')}

/* ---------- Discursiva: bloqueio de colar, arrastar e inserção em bloco ---------- */
var UL="",AVC="🚫 Colar texto não é permitido. Escreva a resposta com suas próprias palavras.";
function avisoC(){var st=$("st");if(st)st.innerHTML='<div class="fb e" role="alert">'+AVC+'</div>'}
function isDs(e){return e.target&&e.target.id==="ds"}
["paste","drop","cut","copy"].forEach(function(ev){document.addEventListener(ev,function(e){if(isDs(e)){e.preventDefault();if(ev==="paste"||ev==="drop")avisoC()}},true)});
document.addEventListener("beforeinput",function(e){if(isDs(e)&&/insertFromPaste|insertFromDrop|insertFromYank|insertReplacementText|insertFromPasteAsQuotation/.test(e.inputType||"")){e.preventDefault();avisoC()}},true);
document.addEventListener("keydown",function(e){if(isDs(e)&&((e.ctrlKey||e.metaKey)&&/^[vxc]$/i.test(e.key)||(e.shiftKey&&e.key==="Insert"))){e.preventDefault();if(/v/i.test(e.key)||e.key==="Insert")avisoC()}},true);
document.addEventListener("input",function(e){if(!isDs(e))return;var v=e.target.value;if(v.length-UL.length>25){e.target.value=UL;avisoC()}else UL=v},true);
/* ---------- Segurança: sair, voltar ou print reinicia tudo ---------- */
function reinicia(m){if(!S||!S.ativo)return;if(S.nome)envia({tipo:"REINICIO",nivel:S.lv+1,motivo:m||"saiu da página",total:S.tot.toFixed(1)+" / "+NQ*4});try{speechSynthesis.cancel()}catch(e){}inicio(m)}
document.addEventListener("visibilitychange",function(){if(document.hidden)reinicia("🔄 Você saiu da página, voltou ou usou captura de tela. Por isso o jogo reiniciou do zero: faça login novamente.")});
window.addEventListener("popstate",function(){reinicia("🔄 Você voltou a página. O jogo reiniciou do zero: faça login novamente.");try{history.pushState({g:1},"")}catch(x){}});
window.addEventListener("pagehide",function(){reinicia("")});
document.addEventListener("keyup",function(e){if(e.key==="PrintScreen"||(e.metaKey&&e.shiftKey)){try{navigator.clipboard.writeText("")}catch(x){}reinicia("📵 Captura de tela detectada. O jogo reiniciou do zero: faça login novamente.")}});
document.addEventListener("keydown",function(e){if(e.key==="PrintScreen")reinicia("📵 Captura de tela detectada. O jogo reiniciou do zero: faça login novamente.")});
document.addEventListener("contextmenu",function(e){if(S&&S.ativo)e.preventDefault()});
inicio();
</script>
</body>
</html>
